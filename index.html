<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhiyantrix - Smart Event Management Platform</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS via CDN with Prompt Design System Palette -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00288e",
            "primary-container": "#1e40af",
            "on-primary": "#ffffff",
            "on-primary-container": "#a8b8ff",
            "primary-fixed": "#dde1ff",
            "primary-fixed-dim": "#b8c4ff",
            "secondary": "#006a61",
            "secondary-container": "#86f2e4",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#006f66",
            "secondary-fixed": "#89f5e7",
            "secondary-fixed-dim": "#6bd8cb",
            "tertiary": "#2000b1",
            "tertiary-container": "#382ad0",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#b6b4ff",
            "tertiary-fixed": "#e2dfff",
            "tertiary-fixed-dim": "#c3c0ff",
            "surface": "#faf8ff",
            "surface-dim": "#d2d9f4",
            "surface-bright": "#faf8ff",
            "surface-variant": "#dae2fd",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f3ff",
            "surface-container": "#eaedff",
            "surface-container-high": "#e2e7ff",
            "surface-container-highest": "#dae2fd",
            "on-surface": "#131b2e",
            "on-surface-variant": "#444653",
            "background": "#faf8ff",
            "on-background": "#131b2e",
            "outline": "#757684",
            "outline-variant": "#c4c5d5",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-error-container": "#93000a",
            "surface-tint": "#3755c3"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          spacing: {
            "xs": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "gutter": "24px",
            "xl": "40px",
            "margin": "32px"
          },
          fontFamily: {
            "body-md": ["Inter", "sans-serif"],
            "headline-md": ["Inter", "sans-serif"],
            "display-lg": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"]
          },
          fontSize: {
            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
          }
        }
      }
    };
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-background text-on-background min-h-screen">

  <!-- Main Dynamic SPA Mount Point -->
  <div id="app-root"></div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-auto"></div>

  <!-- Floating AI Copilot Launcher Button -->
  <button id="ai-copilot-btn" onclick="App.toggleAiAssistant()" class="fixed bottom-6 right-6 z-50 bg-gradient-to-r from-primary via-tertiary to-secondary text-white px-4 py-3 rounded-full shadow-2xl hover:scale-105 transition-all flex items-center gap-2 font-bold text-xs border border-white/30 cursor-pointer" title="Open AI Event Assistant Copilot">
    <span class="material-symbols-outlined text-lg filled">smart_toy</span>
    <span class="hidden sm:inline">AI Copilot</span>
  </button>

  <!-- AI Copilot Chat Drawer / Modal Container -->
  <div id="ai-copilot-container"></div>

  <!-- Application Modules -->
  <script src="js/db.js"></script>
  <script src="js/ai-assistant.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views/landing.js"></script>
  <script src="js/views/student.js"></script>
  <script src="js/views/judge.js"></script>
  <script src="js/views/organizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
